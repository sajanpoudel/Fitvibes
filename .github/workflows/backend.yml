name: backend

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check backend/index.js
      - run: node --check backendforjson/index.js
      - run: cd backend && npm install --ignore-scripts && npm test
      - run: cd backendforjson && npm install --ignore-scripts && npm test
